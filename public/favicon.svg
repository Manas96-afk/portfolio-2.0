<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient for Tab Visibility (works in dark and light browser tabs) -->
    <radialGradient id="tabBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="85%" stop-color="#060910" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Fiery Solar to Gold Gradient -->
    <linearGradient id="logoFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b00" />
      <stop offset="45%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="logoAmber" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff3b00" />
    </linearGradient>

    <!-- High Contrast Neon Glow for Tab Icon -->
    <filter id="logoTabGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border for crisp tab definition -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tabBg)" stroke="rgba(255, 59, 0, 0.35)" stroke-width="1.5" />

  <!-- Outer Cyber Hexagon Accent -->
  <path d="M32,7 L53,19 L53,45 L32,57 L11,45 L11,19 Z" fill="rgba(255, 59, 0, 0.08)" stroke="url(#logoFlame)" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- MB Monogram (Manas Bandhu) — Bold & Thick for perfect 16px/32px browser tab clarity -->
  <!-- 'M' Letterform Vector -->
  <path
    d="M17,47 L17,17 L28,32 L34,22 L34,47"
    fill="none"
    stroke="url(#logoFlame)"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logoTabGlow)"
  />

  <!-- 'B' Letterform Vector Interlocking from Center Spine -->
  <path
    d="M34,22 C42,22 47,25 47,31 C47,36 41,38 34,38 C43,38 48,41 48,46 C48,51 41,52 34,52 L27,52"
    fill="none"
    stroke="url(#logoAmber)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cybernetic Corner Nodes -->
  <circle cx="32" cy="7" r="2" fill="#ff3b00" />
  <circle cx="53" cy="19" r="2" fill="#d4af37" />
  <circle cx="11" cy="45" r="2" fill="#ff8800" />
  <circle cx="28" cy="32" r="1.6" fill="#ffffff" />
</svg>