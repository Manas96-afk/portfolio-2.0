<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <!-- Flame & Gold Gradient -->
    <linearGradient id="mbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b00" />
      <stop offset="45%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Secondary Cyan/White Shimmer -->
    <linearGradient id="mbGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ff2a00" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="mbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Emblem 'MB' (X: 8 to 56, Y: 8 to 56) -->
  <g id="emblem" transform="translate(6, 4)">
    <!-- Ambient Backdrop Ring/Hexagon -->
    <path d="M28,2 L52,15 L52,41 L28,54 L4,41 L4,15 Z" fill="rgba(255, 59, 0, 0.06)" stroke="url(#mbGrad1)" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Outer 'M' Geometric Path with Sharp Angular Apexes -->
    <path d="M12,43 L12,13 L24,28 L32,18 L32,43" fill="none" stroke="url(#mbGrad1)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#mbGlow)" />

    <!-- Interlocking 'B' Form seamlessly integrated from the center spine -->
    <path d="M32,18 C39,18 45,21 45,28 C45,33 40,35 32,35 C42,35 46,38 46,44 C46,50 38,51 32,51 L26,51" fill="none" stroke="url(#mbGrad2)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Futuristic Cyber Accents / Geometric Corner Dots -->
    <circle cx="28" cy="2" r="1.8" fill="#ff3b00" />
    <circle cx="52" cy="15" r="1.8" fill="#d4af37" />
    <circle cx="4" cy="41" r="1.8" fill="#ff7700" />
    <circle cx="24" cy="28" r="1.5" fill="#ffffff" />
  </g>

  <!-- Typography: 'MANAS BANDHU' -->
  <g id="brand-text" transform="translate(74, 0)">
    <!-- First Name: MANAS -->
    <text x="0" y="32" font-family="'Syne', 'Space Grotesk', 'Montserrat', sans-serif" font-size="22" font-weight="800" letter-spacing="0.14em" fill="#ffffff">
      MANAS
    </text>

    <!-- Last Name: BANDHU (Accent Color) -->
    <text x="96" y="32" font-family="'Syne', 'Space Grotesk', 'Montserrat', sans-serif" font-size="22" font-weight="800" letter-spacing="0.14em" fill="url(#mbGrad1)">
      BANDHU
    </text>

    <!-- Subtitle / Identity Pill -->
    <text x="1" y="49" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.32em" fill="#8ea5b8">
      MOTION DESIGN &amp; CODE
    </text>

    <!-- Dynamic Accent Dot -->
    <circle cx="168" cy="46.5" r="2.2" fill="#ff3b00" filter="url(#mbGlow)" />
  </g>
</svg>
